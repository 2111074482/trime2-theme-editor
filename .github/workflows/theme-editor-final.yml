name: Theme Editor Final

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  CI_NAME: Theme Editor Final CI
  BUILD_ABI: arm64-v8a

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.31.6" "ndk;28.0.13004108"

      - name: Calculate native cache hash
        id: native-hash
        run: ./gradlew :app:calculateNativeCacheHash

      - name: Restore native cache
        uses: actions/cache@v4
        id: native-cache
        with:
          path: app/prebuilt
          key: ubuntu-24.04-trime-editor-${{ steps.native-hash.outputs.native-cache-hash }}

      - name: Verify source hygiene
        run: |
          test -z "$(git diff --check)"
          if grep -RInE 'API_KEY=|API_ID=|storePassword=|keyPassword=' app/src/main; then
            echo "Potential secret assignment found in tracked source"
            exit 1
          fi

      # Unit tests are a required gate for the editor APK artifact.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: trime-theme-editor-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify editor APK contents and checksum
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" -a -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools/35.0.0" -maxdepth 1 -type f -name aapt -print -quit)"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > app/build/theme-editor-manifest.txt
          grep -q 'com.osfans.trime.editor.ui.ThemeEditorActivity' app/build/theme-editor-manifest.txt
          grep -q 'themeeditor.fileprovider' app/build/theme-editor-manifest.txt
          unzip -l "$APK" > app/build/theme-editor-apk-files.txt
          grep -q 'res/xml/theme_editor_provider_paths.xml' app/build/theme-editor-apk-files.txt
          sha256sum "$APK" | tee app/build/theme-editor-apk.sha256

      - name: Upload editor verification summary
        uses: actions/upload-artifact@v5
        with:
          name: trime-theme-editor-verification
          path: |
            app/build/theme-editor-manifest.txt
            app/build/theme-editor-apk-files.txt
            app/build/theme-editor-apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: trime-theme-editor-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
